<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Flor Morena</title>
    <link rel="stylesheet" href="/css/style-contato.css">
</head>
<body>
    <header>
        <img src="assets/Logotipomenor.png" alt="Logo Flor Morena" class="logo">
        <nav>
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="sobre.html">Sobre</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <section class="banner-contato">
        <h1>Entre em Contato</h1>
        <p>Estamos prontos para ajudar você com dúvidas, pedidos e informações sobre nossos produtos.</p>
    </section>

    <!--Conteúdo principal-->
    <section class="contato">
        <form>
            <label>Nome:</label> 
            <input type="text" placeholder="Seu nome">
            <label>Email:</label> 
            <input type="email" placeholder="Seu email">
            <label>Mensagem:</label>
            <textarea placeholder="Digite sua mensagem"></textarea>
            <button type="submit">Enviar</button>
        </form>
    </section>

    <!--MiniMapa-->
    <div class="mapa-container">
        <h2>Venha nos fazer uma visita!</h2>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3707.9740198718896!2d-49.74839832544831!3d-21.66486799466836!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94be15947d2b1757%3A0x19685f1e2b0e2d65!2sFlor%20Morena!5e0!3m2!1spt-BR!2sbr!4v1763665070208!5m2!1spt-BR!2sbr"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <!--Rodapé-->
    <footer>
        <div class="footer-container">
            <div class="footer-centro">
                <p>© 2025 Flor Morena — Todos os direitos reservados.</p>
            </div>
            <div class="footer-direita">
                <a href="https://www.instagram.com/flormorena_lins?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
                    target="_blank">
                    <img src="assets/icons8-instagram-48.png" alt="Instagram">
                </a>

                <a href="https://wa.me/5514998982320" target="_blank">
                    <img src="assets/icons8-whatsapp-48.png" alt="WhatsApp">
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
